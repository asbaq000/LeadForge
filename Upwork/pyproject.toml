[project]
name = "upwork-scraper"
version = "0.1.0"
description = "Standalone Upwork job scraper - fetch public job listings, no database required"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.9.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
upwork-scraper = "upwork_scraper.cli:main"

[project.optional-dependencies]
browser = ["patchright>=1.40"]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "pylint>=3.3.3",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["upwork_scraper*"]

[tool.setuptools.package-data]
upwork_scraper = ["niches/*.json"]

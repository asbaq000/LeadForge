[project]
name = "x-leads"
version = "1.0.0"
description = "Find people on X (Twitter) asking for video editing help — lead generation for a video editing business"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
]

[project.scripts]
x-leads = "x_leads.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["x_leads*"]

[tool.setuptools.package-data]
x_leads = ["niches/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
